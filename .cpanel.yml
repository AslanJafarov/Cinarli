---
deployment:
  tasks:
    # The Node.js app runs directly from this repository (cPanel > Setup Node.js App,
    # application root "repositories/Cinarli", startup file "server.js").
    # Build into a separate folder first; only a successful build replaces the served .next,
    # so a failed install or build leaves the running site untouched.
    - export APP=/home/chinrlfh/repositories/Cinarli
    - source /home/chinrlfh/nodevenv/repositories/Cinarli/24/bin/activate
    # "npm install" updates node_modules in place; "npm ci" would delete it while the app is serving.
    - cd $APP && npm install --no-audit --no-fund
    # One build worker: the shared host caps memory at 2 GB and kills multi-worker builds.
    - cd $APP && rm -rf .next-build && NEXT_DIST_DIR=.next-build NEXT_BUILD_CPUS=1 npm run build
    - cd $APP && rm -rf .next-previous
    - cd $APP && test ! -d .next || mv .next .next-previous
    - cd $APP && mv .next-build .next
    # Passenger restarts the app on the next request.
    - mkdir -p $APP/tmp && touch $APP/tmp/restart.txt
